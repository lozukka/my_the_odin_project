<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Form</title>
  </head>
  <body>
    <main>
      <div id="left">
        <div id="logo-banner">
          <img src="odin-lined.png" alt="The Odin Project logo" />
          <h1>ODIN</h1>
        </div>
        <p id="photo-credit">
          Photo by
          <a
            href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Halie West</a
          >
          on
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Unsplash</a
          >
        </p>
      </div>
      <div id="right">
        <p id="intro">
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. <br />
          Sign up <em>now</em> to get started. <br />
          <br />
          You <em>know</em> you want to.
        </p>
        <div id="form-section">
          <h2>Let's do this!</h2>
          <form action="" method="post">
            <fieldset>
              <div>
                <label for="first_name">First name</label>
                <input type="text" id="first_name" name="first_name" />
              </div>
              <div>
                <label for="last_name">Last name</label>
                <input type="text" id="last_name" name="last_name" />
              </div>
            </fieldset>
            <fieldset>
              <div>
                <label for="user_email">Email</label>
                <input type="email" id="user_email" name="user_email" />
              </div>
              <div>
                <label for="user_phonenumber">Phone number</label>
                <input
                  type="text"
                  id="user_phonenumber"
                  name="user_phonenumber"
                />
              </div>
            </fieldset>
            <fieldset>
              <div>
                <label for="user_password">Password</label>
                <input
                  type="password"
                  id="user_password"
                  name="user_password"
                />
              </div>
              <div>
                <label for="user_password_again">Confirm Password</label>
                <input
                  type="password"
                  id="user_password_again"
                  name="user_password_again"
                />
              </div>
            </fieldset>
            <button type="submit">Create Account</button>
          </form>
        </div>
        <p id="account-already">
          Already have an account? <a href="#">Log in</a>
        </p>
      </div>
    </main>
  </body>
</html>
